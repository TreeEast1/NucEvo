[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nucevo"
version = "1.0.0"
description = "NucEvo: Training-Free Verified Experience Evolution for Nuclear Thermal-Hydraulic Modeling"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "torch>=2.1.0",
    "transformers>=4.44.0",
]

[tool.setuptools.packages.find]
include = ["nucevo*"]

[tool.setuptools.package-data]
"nucevo.benchmark.nuclear_edu" = ["*.mo"]
